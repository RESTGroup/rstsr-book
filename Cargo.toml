[workspace]
resolver = "2"
members = [
    "listings/features*",
]

[workspace.package]
version = "0.0.0"
edition = "2021"

[workspace.dependencies]
rayon = { version = "1.10" }
rstsr = { version = ">=0.7.9", features = ["linalg", "faer", "openblas"] }
rstsr-openblas = { version = ">=0.7.9", features = ["linalg", "openmp"] }
rstsr-linalg-traits = { version = ">=0.7.9", features = ["faer"] }
rstsr-blas-traits = { version = ">=0.7.9" }
rstsr-core = { version = ">=0.7.9" }
